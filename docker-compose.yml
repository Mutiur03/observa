services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: observa
      POSTGRES_USER: observa
      POSTGRES_PASSWORD: observa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://observa:observa@postgres:5432/observa
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-in-production
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && fastapi run app/main.py --port 8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
