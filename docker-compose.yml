services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: observa
      POSTGRES_USER: observa
      POSTGRES_PASSWORD: observa
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://observa:observa@postgres:5432/observa
      REDIS_URL: redis://redis:6379/0
      OBSERVA_API_KEY: ${OBSERVA_API_KEY:-}
      JWT_SECRET_KEY: change-me-in-production
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001","http://localhost:5173","http://127.0.0.1:5173","http://localhost:5174","http://127.0.0.1:5174","http://localhost:5175","http://127.0.0.1:5175","http://localhost:5176","http://127.0.0.1:5176","http://localhost:5177","http://127.0.0.1:5177"]'
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && fastapi run app/main.py --port 8000"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      SERVER_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
