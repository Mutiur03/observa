services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observa}
      POSTGRES_USER: ${POSTGRES_USER:-observa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    image: ghcr.io/mutiur03/observa-backend:latest
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-observa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-observa}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["*"]'}
      ENVIRONMENT: production
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && fastapi run app/main.py --port 8000"
    restart: always

volumes:
  postgres_data:
