name: Build, Push, and Deploy Backend to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Copy docker-compose.prod.yml to VPS (defaults to ~/observa)
      - name: Copy docker-compose.prod.yml to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml"
          target: "observa"

      # SSH to VPS and pull/run containers
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            mkdir -p ~/observa
            cd ~/observa
            
            # Log into GHCR to fetch packages securely
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest backend container
            docker compose -f docker-compose.prod.yml pull
            
            # Start/recreate containers
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Prune old dangling images to save disk space
            docker image prune -f

            # --- AUTOMATED NGINX & SSL SETUP ---
            # 1. Install Nginx, Certbot & Python Certbot plugin if missing
            if ! command -v nginx &> /dev/null; then
              echo "Installing Nginx and Certbot..."
              sudo apt-get update
              sudo apt-get install -y nginx certbot python3-certbot-nginx
            fi

            # 2. Write Nginx Virtual Host configuration for observa-api.mutiurrahman.com
            NGINX_CONF="/etc/nginx/sites-available/observa-api.mutiurrahman.com"
            if [ ! -f "$NGINX_CONF" ]; then
              echo "Configuring Nginx Virtual Host..."
              echo 'server {
                  listen 80;
                  server_name observa-api.mutiurrahman.com;

                  location / {
                      proxy_pass http://127.0.0.1:8000;
                      proxy_http_version 1.1;
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection "upgrade";
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
              }' | sudo tee "$NGINX_CONF"
              sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/
              sudo nginx -t && sudo systemctl reload nginx
            fi

            # 3. Request Let's Encrypt SSL certificate automatically if not already obtained
            if [ ! -d "/etc/letsencrypt/live/observa-api.mutiurrahman.com" ]; then
              echo "Requesting SSL Certificate from Let's Encrypt..."
              sudo certbot --nginx -d observa-api.mutiurrahman.com --non-interactive --agree-tos --register-unsafely-without-email
              sudo systemctl reload nginx
            fi
